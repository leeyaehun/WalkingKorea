name: Verify web build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/hanok-a01.test.js tests/neighborhood-movement.test.js
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
