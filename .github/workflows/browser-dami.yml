name: Browser render verification for Dami v0.7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Inspect live browser and capture images
        run: node scripts/qa-dami.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkingkorea-dami-live-screenshots
          path: qa-screenshots/
