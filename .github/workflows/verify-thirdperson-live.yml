name: Verify live WalkingKorea v0.10
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check publicly delivered version
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 3 -D /tmp/live-headers https://walkingkorea.leeyaehun.workers.dev/ -o /tmp/live.html
          # Native Wrangler builds do not carry the custom API fallback header.
          # Verify actual playable-v0.8 HTML instead of deployment transport.
          grep -q 'VOL. 10' /tmp/live.html
          grep -q 'data-avatar="girl"' /tmp/live.html
      - name: Check real-world third-person movement
        env:
          WK_BASE_URL: https://walkingkorea.leeyaehun.workers.dev/
        run: node scripts/qa-third-person.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkingkorea-live-v010
          path: qa-screenshots/
