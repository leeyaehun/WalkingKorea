name: Preview grounded four-paw Dami gait
on:
  push:
    branches: [feature/dami-grounded-walk-v09]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run local Vite preview
        shell: bash
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/walkingkorea-preview.log 2>&1 &
          for attempt in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/walkingkorea-preview.log
          exit 1
      - name: Test grounded footfalls and camera-separated movement
        run: node scripts/qa-third-person.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkingkorea-grounded-gait-preview
          path: qa-screenshots/
