name: Package grounded Dami v0.9
on:
  push:
    branches: [feature/dami-grounded-walk-v09]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify compiled web bundle
        run: |
          test -s dist/index.html
          test -s dist/character.html
          test -s dist/guide-cat.svg
      - name: Publish only generated site to an isolated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/walkingkorea-compiled
          cp -R dist/. /tmp/walkingkorea-compiled/
          git switch --orphan compiled-dami-v09
          cp -R /tmp/walkingkorea-compiled/. .
          git add -A -- index.html character.html assets guide-cat.svg
          git -c user.name='WalkingKorea Build Bot' -c user.email='actions@users.noreply.github.com' commit -m "WalkingKorea Dami grounded walk from ${GITHUB_SHA}" >/dev/null
          git push origin HEAD:refs/heads/deploy/compiled-dami-v09 --force
